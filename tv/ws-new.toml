[metadata]
name = "ws-new"
description = "Pick a repo from $WS_SRC_ROOT to start a new workspace"

[source]
command = "src-repos-list.sh"

[preview]
command = "git -C '{}' log --oneline -15 2>/dev/null"

[keybindings]
enter = "actions:create"

[actions.create]
description = "Create a workspace from this repo (prompts for a branch)"
command = "ws-create.sh '{}'"
mode = "execute"

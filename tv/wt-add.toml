[metadata]
name = "wt-add"
description = "Pick a repo from $WS_SRC_ROOT to add to the current workspace"

[source]
command = "src-repos-list.sh \"$(cat \"${WS_STATE:-/tmp/tv-ws}\" 2>/dev/null)\""

[preview]
command = "git -C '{}' log --oneline -15 2>/dev/null"

[keybindings]
enter = "actions:add"

[actions.add]
description = "Add this repo as a worktree to the current workspace"
command = "wt-add.sh '{}'"
mode = "execute"
